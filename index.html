<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator | HTML CSS JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Favicon icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-HgvS8UshO7f3y3f9w6d...[Your-Integrity-Hash]..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <main class="calculator">
        
        <section class="Main-content">

            <!-- Calculator Display -->
            <section class="display">
                <div class="expression" id="expression"></div>

                <div class="result" id="result"></div>

            </section>


            <!-- Calculator Buttons -->
            <section class="buttons">

                <!-- Row 1 -->
                <button class="btn btn-action" id="clear">AC</button>
                <button class="btn btn-action" id="signDelete"><i class="fa-solid fa-delete-left"></i></button>
                <button class="btn btn-action" id="percentage">%</button>
                <button class="btn btn-operator" id="divide">÷</button>


                <!-- Row 2 -->
                <button class="btn btn-number" id="seven">7</button>
                <button class="btn btn-number" id="eight">8</button>
                <button class="btn btn-number" id="nine">9</button>
                <button class="btn btn-operator" id="multiply">×</button>


                <!-- Row 3 -->
                <button class="btn btn-number" id="four">4</button>
                <button class="btn btn-number" id="five">5</button>
                <button class="btn btn-number" id="six">6</button>
                <button class="btn btn-operator" id="subtract">-</button>


                <!-- Row 4 -->
                <button class="btn btn-number" id="one">1</button>
                <button class="btn btn-number" id="two">2</button>
                <button class="btn btn-number" id="three">3</button>
                <button class="btn btn-operator" id="add">+</button>


                <!-- Row 5 -->
                <button class="btn btn-number btn-zero" id="zero">0</button>
                <button class="btn btn-number" id="decimal">.</button>
                <button class="btn btn-equal btn-operator" id="equals">=</button>

            </section>

        </section>

    </main>
    
</body>
<script src="script.js"></script>
</html>
